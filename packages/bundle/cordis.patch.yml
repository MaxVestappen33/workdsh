- insert:
    - id: workdsh-installation-probe
      name: workdsh-bundle
    - id: computer-use
      name: '@deepseek-ai/dsh-computer-use'
    - id: computer-use-cua-driver-native
      name: '@deepseek-ai/dsh-experimental-computer-use-cua-driver-native'
    - id: browser-use
      name: '@deepseek-ai/dsh-browser-use'
    - id: browser-use-playwright-mcp
      name: '@deepseek-ai/dsh-experimental-browser-use-playwright-mcp'
      disabled: !!js "!!process.env.DSH_ELECTRON_EXECUTABLE"
      config:
        mode: launch
        headless: true
        executablePath: !!js "process.env.DSH_BROWSER_EXECUTABLE ?? (process.platform === 'darwin' ? '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' : undefined)"
    - id: workdsh-browser-session
      name: workdsh-provider-browser-session
      disabled: !!js "!process.env.DSH_ELECTRON_EXECUTABLE"
      config:
        electronExecutable: !!js "process.env.DSH_ELECTRON_EXECUTABLE"
        electronAppPath: !!js "process.env.DSH_ELECTRON_APP_PATH"
    - id: auto-review
      name: '@deepseek-ai/dsh-experimental-auto-review'
- id: ui-sidebar-browser
  disabled: false
# WorkDSH 定制：跳过「预览版说明」弹窗。
# 官方插件 @deepseek-ai/dsh-client-ui-settings-models 硬编码 WELCOME_NOTICE_VERSION="2026-09-28.1"，
# 仅当设置值 ui-settings-general.welcomeNoticeVersion 与该版本号「全等」时才视为已确认、不弹窗。
# 这里在打包补丁层预置该值，等价于「出厂即已点击继续」，新装机首次启动不再显示预览版说明。
# 注意：若官方未来提升 WELCOME_NOTICE_VERSION，需要同步修改下面的字符串。
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
# WorkDSH 定制：跳过「添加一个 API Key 开始使用」首次运行弹窗。
# 官方插件 @deepseek-ai/dsh-client-ui-settings-models 的 Host 半有 credentialOnboarding 配置（默认 true），
# 会在 webserver/index-inject 时把它注入页面全局 __DSH_MODELS_ONBOARDING__，Client 半据此决定是否注册该弹窗。
# 设为 false 即等价于「其他原生壳仅禁用凭证引导步骤」，只关掉自动弹出，不删除功能：
# 「设置 → 模型 → 自定义模型 API」表单与显式 API Key 编辑仍然完全可用。
- id: ui-settings-models
  name: "@deepseek-ai/dsh-client-ui-settings-models"
  config:
    credentialOnboarding: false
# WorkDSH 定制：预置的「本地模型」与默认模型不在此文件。
# 本文件会被桌面载体当作 --patch overlay 传入，而 overlay 对同 id 的 config 整体替换，
# 会盖掉设置页写入 profile 用户层的修改，导致用户无法再添加自定义大模型。
# 这两行属于「设置页可改写的安装方默认值」，见 cordis.defaults.patch.yml，
# 由 Desktop 在创建/迁移 Profile 时一次性种子进 profile 用户层。
# WorkDSH 定制：内网离线部署不挂载官方 DeepSeek 直连路由，设置页与模型选择器里
# 不再出现「DeepSeek」那一条。要在互联网上使用：删掉下面这两行重新出包即可恢复；
# 端点默认走官方根地址（https://api.deepseek.com/anthropic），只需在
# 「设置 → 模型」里给 DeepSeek 填一次 DEEPSEEK_API_KEY。
- id: llm-deepseek
  disabled: true
